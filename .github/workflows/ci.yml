name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint · unit tests · config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev + trainer deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r services/trainer/requirements.txt      # zenml/optuna/mlflow for pipeline tests
      - name: Ruff (lint)
        run: ruff check services tests monitoring/grafana/build_dashboards.py
      - name: Pytest (unit tests)
        run: pytest tests/test_units.py -v
      - name: Validate Prometheus rules & config (promtool)
        run: |
          docker run --rm -v "$PWD/monitoring/prometheus:/p:ro" --entrypoint promtool prom/prometheus:v3.5.0 \
            check config /p/prometheus.yml
          docker run --rm -v "$PWD/monitoring/prometheus/rules:/r:ro" --entrypoint promtool prom/prometheus:v3.5.0 \
            check rules /r/recording_rules.yml /r/alert_rules.yml
      - name: Validate Alertmanager config (amtool)
        run: |
          docker run --rm -v "$PWD/monitoring/alertmanager:/a:ro" --entrypoint sh prom/alertmanager:v0.28.1 -c \
            'sed -e "s|\${SMTP_HOST}|mailhog|g;s|\${SMTP_PORT}|1025|g;s|\${SMTP_FROM}|a@b|g;s|\${ALERT_EMAIL_TO}|c@d|g;s|\${SLACK_WEBHOOK_URL}|http://x/y|g" /a/alertmanager.yml > /tmp/am.yml && amtool check-config /tmp/am.yml'
      - name: Validate docker-compose
        run: docker compose -f docker-compose.yml -f docker-compose.second-model.yml config --quiet
      - name: Dashboards are reproducible from code
        run: |
          python monitoring/grafana/build_dashboards.py
          git diff --exit-code -- monitoring/grafana/dashboards || (echo "run make dashboards and commit" && exit 1)

  docker-build:
    name: Build all service images
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [model_api, gateway, drift_exporter, load_generator, webhook_catcher, mlflow, system_exporter]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Lowercase image owner (GHCR requires lowercase names)
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ steps.owner.outputs.name }}/team4-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    name: Compose up + smoke test
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for services
        run: |
          for i in $(seq 1 40); do
            curl -sf localhost:8000/health && curl -sf localhost:9090/-/ready && curl -sf localhost:3000/api/health && break
            sleep 5
          done
          sleep 30
      - name: Smoke test
        run: python tests/smoke_test.py
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Tear down
        if: always()
        run: docker compose down -v
