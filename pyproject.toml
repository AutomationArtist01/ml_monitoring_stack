[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["external", "monitoring/grafana/dashboards"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "E702", "B008", "B904", "E731", "B007", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
