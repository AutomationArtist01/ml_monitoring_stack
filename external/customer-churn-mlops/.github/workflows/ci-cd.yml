name: Customer Churn MLOps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint
        run: |
          flake8 api.py src inspect_data.py run_pipeline.py tests

      - name: Run tests
        run: |
          python -m pytest -v

      - name: Compile Python files
        run: |
          python -m py_compile api.py
          python -m py_compile src/pipeline.py
          python -m py_compile src/preprocessing.py

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/nisarg7314/customer-churn-mlops:latest .

      - name: Push Docker image
        run: |
          docker push ghcr.io/nisarg7314/customer-churn-mlops:latest
